name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: pytest

  # The published page is generated from the demo log by the scanner itself. Rebuilding it
  # here and diffing catches the failure mode a hand-edited page actually has: figures that
  # no longer match the code they claim to come from.
  drift:
    name: Published page matches the code that makes it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Rebuild the page
        run: python -m auth_log_scan.site --log sample/auth-demo.log --out build/site
      - name: Fail if docs/index.html is stale or hand-edited
        run: |
          if ! diff -u docs/index.html build/site/index.html; then
            echo "::error file=docs/index.html::The published page is not what the build produces. Run 'python -m auth_log_scan.site' and commit the result."
            exit 1
          fi

  deploy:
    name: Publish docs/ to GitHub Pages
    needs: [test, drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
